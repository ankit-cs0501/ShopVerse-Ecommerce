{% extends "base.html" %}{% block title %}Admin dashboard{% endblock %}{% block content %}<h1 class="h2 fw-bold mb-4">Store overview</h1><div class="row g-3 mb-4"><div class="col-md-4"><div class="stat-card"><span>Products</span><strong>{{ products }}</strong></div></div><div class="col-md-4"><div class="stat-card"><span>Orders</span><strong>{{ orders }}</strong></div></div><div class="col-md-4"><div class="stat-card"><span>Gross order value</span><strong>₹{{ '%.2f'|format(revenue) }}</strong></div></div></div><a class="btn btn-dark me-2" href="{{ url_for('admin.products') }}">Manage products</a><a class="btn btn-outline-dark" href="{{ url_for('admin.orders') }}">Manage orders</a>{% endblock %}
