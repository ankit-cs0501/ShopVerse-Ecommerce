{% extends "base.html" %}{% block title %}Manage products{% endblock %}{% block content %}<h1 class="h2 fw-bold mb-4">Manage products</h1><div class="card border-0 shadow-sm mb-4"><div class="card-body"><h2 class="h5">Add a product</h2><form method="post" class="row g-2"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="col-md-4"><input class="form-control" name="name" placeholder="Product name" required></div><div class="col-md-2"><input class="form-control" name="price" type="number" step=".01" min=".01" placeholder="Price" required></div><div class="col-md-2"><input class="form-control" name="stock" type="number" min="0" placeholder="Stock" required></div><div class="col-md-4"><select class="form-select" name="category_id" required>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select></div><div class="col-12"><input class="form-control" name="image_url" placeholder="Image URL (optional)"></div><div class="col-12"><textarea class="form-control" name="description" placeholder="Description" required></textarea></div><div class="col-12"><button class="btn btn-dark">Create product</button></div></form></div></div><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody>{% for p in products %}<tr><td>{{ p.name }}</td><td>₹{{ p.price }}</td><td>{{ p.stock }}</td><td>{{ 'Active' if p.active else 'Hidden' }}</td><td><form method="post" action="{{ url_for('admin.toggle_product', product_id=p.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn btn-sm btn-outline-secondary">{{ 'Hide' if p.active else 'Activate' }}</button></form></td></tr>{% endfor %}</tbody></table></div>{% endblock %}
