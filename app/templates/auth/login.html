{% extends "base.html" %}{% block title %}Login{% endblock %}{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto"><div class="card-body p-4 p-md-5"><h1 class="h3 fw-bold">Welcome back</h1><p class="text-muted">Sign in to continue shopping.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-dark w-100">Login</button></form><p class="small mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p></div></div>{% endblock %}
