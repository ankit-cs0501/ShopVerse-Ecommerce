{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}
<div class="auth-card card border-0 shadow-sm mx-auto"><div class="card-body p-4 p-md-5"><h1 class="h3 fw-bold">Create your account</h1><p class="text-muted">A better way to shop starts here.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required maxlength="100"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" minlength="8" required><button class="btn btn-dark w-100">Create account</button></form></div></div>{% endblock %}
